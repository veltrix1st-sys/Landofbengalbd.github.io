<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veltrix BD - Premium Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Hind Siliguri', sans-serif; 
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px 15px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(37, 211, 102, 0.3);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .header { text-align: center; margin-bottom: 30px; }
    .logo { 
      font-size: 38px; font-weight: 700; 
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .tagline { color: #888; font-size: 15px; }
    .wa-btn {
      display: block; width: 100%; padding: 16px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #fff; border-radius: 14px; text-decoration: none;
      font-weight: 600; font-size: 16px; text-align: center;
      margin-bottom: 35px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }
    .wa-btn:active { transform: scale(0.97); }
    .free-ship-banner {
      background: linear-gradient(135deg, #ff9500 0%, #ff3b30 100%);
      padding: 10px; border-radius: 10px; text-align: center;
      font-size: 13px; font-weight: 600; margin-bottom: 20px;
    }
    .section-title {
      font-size: 17px; font-weight: 600; margin: 0 0 18px 4px;
      color: #25D366; display: flex; align-items: center; gap: 8px;
    }
    .product-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px;
    }
    .product-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 16px 10px; text-align: center;
      transition: all 0.3s ease; cursor: pointer; position: relative;
    }
    .product-card:active {
      transform: scale(0.95);
      background: rgba(37, 211, 102, 0.15);
    }
    .offer-badge {
      position: absolute; top: 8px; right: 8px;
      background: #ff3b30; color: #fff; font-size: 10px;
      font-weight: 700; padding: 3px 7px; border-radius: 6px; z-index: 2;
    }
    .product-img {
      width: 100%; height: 85px; object-fit: cover;
      border-radius: 10px; margin-bottom: 8px;
    }
    .product-icon { font-size: 32px; margin-bottom: 8px; }
    .product-name { font-weight: 600; font-size: 13px; margin-bottom: 8px; min-height: 32px; }
    .price-box { margin-bottom: 8px; }
    .old-price { font-size: 12px; color: #777; text-decoration: line-through; }
    .offer-price { font-size: 18px; font-weight: 700; color: #25D366; }
    .save-text { font-size: 10px; color: #ff9500; margin-top: 2px; }
    .order-btn {
      width: 100%; padding: 8px; background: #25D366;
      color: #000; border: none; border-radius: 8px;
      font-weight: 600; font-size: 12px; margin-top: 6px;
    }
    #orderSection { display: none; animation: slideUp 0.4s ease; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .order-header {
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.3);
      padding: 14px; border-radius: 12px; margin-bottom: 20px;
    }
    .order-product-info { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .order-price-box {
      background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;
      display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px;
    }
    .order-form {
      background: rgba(255, 255, 255, 0.04);
      padding: 22px; border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; margin-bottom: 8px; font-size: 14px;
      color: #bbb; font-weight: 500;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 15px;
      font-family: 'Hind Siliguri', sans-serif;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: #25D366;
    }
    .btn-primary {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #fff; border: none; border-radius: 12px;
      font-weight: 600; font-size: 16px; cursor: pointer;
      margin-bottom: 10px;
    }
